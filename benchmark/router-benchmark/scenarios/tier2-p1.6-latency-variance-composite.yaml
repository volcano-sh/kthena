name: "tier2-p1.6-latency-variance-composite"
description: "P1.6: composite latency variance (speedup + maxNumSeqs)"

load:
  schedule:
    mode: "rate"
    rate: 5
  traffic:
    burstiness: 1.0
    ramp:
      strategy: "none"
  prompts:
    - tokens: 512
      weight: 10
  max_tokens:
    - tokens: 128
      weight: 10
  duration: "60s"

backends:
  common:
    engineType: "sglang"
    model: "Qwen/Qwen3-0.6B"
  profiles:
    - name: "fast"
      count: 2
      speedupRatio: 10.0
      maxNumSeqs: 256
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
    - name: "normal"
      count: 2
      speedupRatio: 1.0
      maxNumSeqs: 128
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
    - name: "slow"
      count: 2
      speedupRatio: 0.2
      maxNumSeqs: 32
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

metrics:
  prometheus: true
  pprof: false

aiperf:
  extraArgs:
    - "--tokenizer"
    - "Qwen/Qwen3-0.6B"
