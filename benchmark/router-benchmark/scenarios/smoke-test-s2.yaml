name: "smoke-test-s2-latency-vs-qps"
description: "s2 scenario: mid-QPS steady-state comparison point"

load:
  schedule:
    mode: "rate"
    rate: 20
  traffic:
    burstiness: 1.0
    ramp:
      strategy: "none"
  prompts:
    - tokens: 512
      weight: 10
  max_tokens:
    - tokens: 128
      weight: 10
  duration: "45s"

backends:
  common:
    engineType: "sglang"
    model: "Qwen/Qwen3-0.6B"
  profiles:
    - name: "homogeneous"
      count: 8
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

metrics:
  prometheus: true
  pprof: true
  cpuProfileSeconds: 60
  profiles:
    - heap
    - goroutine
    - allocs
    - mutex

aiperf:
  extraArgs:
    - "--tokenizer"
    - "Qwen/Qwen3-0.6B"
