apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: full-sample
  namespace: default
spec:
  replicas: 2
  schedulerName: volcano
  recoveryPolicy: RoleRecreate
  revisionHistoryLimit: 10
  # Optional plugin chain that mutates serving pods, executed in list order.
  plugins:
    - name: demo-pod-tweaks
      type: BuiltIn
      config:
        annotations:
          example.com/custom: "value"
        env:
          - name: CUSTOM_VAR
            value: "custom-value"
      # Optional scope. Empty roles means all roles, and target can be All (default), Entry or Worker.
      scope:
        roles: ["prefill", "decode"]
        target: All
  rolloutStrategy:
    type: ServingGroupRollingUpdate
    # Recreate (default) or InPlace.
    updateMethod: Recreate
    ## Bounds in-place updates, and every rollout when failurePolicy is set.
    progressDeadlineSeconds: 1800
    # Optional. Detects a rollout that makes no progress within progressDeadlineSeconds.
    # Halt stops replacing healthy ServingGroups; Rollback restores the last completed revision.
    failurePolicy:
      action: Halt
    # With RoleRollingUpdate, remove this block and set the same fields inline on each Role instead.
    rollingUpdateConfiguration:
      maxUnavailable: 1
      maxSurge: 0
      partition: 0
    evictionStrategy:
      protectionLevel: ServingGroup
      minAvailable: 1
  template:
    restartGracePeriodSeconds: 60
    gangPolicy:
      minRoleReplicas:
        prefill: 1
        decode: 1
    # The prerequisite for using networkTopology is that the HyperNode resource object must exist on the Volcano side.    
    networkTopology:
      groupPolicy:
        mode: hard
        highestTierAllowed: 2
      rolePolicy:
        mode: hard
        highestTierAllowed: 1
    roles:
      - name: prefill
        replicas: 1
        # Role-level rolling update settings, used only when rolloutStrategy.type is RoleRollingUpdate.
        # maxUnavailable: 1
        # maxSurge: 0
        # partition: 0
        entryTemplate:
          metadata:
            labels:
              example.com/component: prefill-entry
            annotations:
              example.com/description: "prefill entry pod"
          spec:
            containers:
              - name: leader
                image: nginx
                ports:
                  - containerPort: 8080
                resources:
                  limits:
                    cpu: "0.1"
                  requests:
                    cpu: "0.1"
        workerReplicas: 1
        workerTemplate:
          metadata:
            labels:
              example.com/component: prefill-worker
          spec:
            containers:
              - name: worker
                image: nginx
                ports:
                  - containerPort: 8080
                resources:
                  limits:
                    cpu: "0.1"
                  requests:
                    cpu: "0.1"
      - name: decode
        replicas: 1
        # Role-level rolling update settings, used only when rolloutStrategy.type is RoleRollingUpdate.
        # maxUnavailable: 1
        # maxSurge: 0
        # partition: 0
        entryTemplate:
          metadata:
            labels:
              example.com/component: decode-entry
          spec:
            containers:
              - name: leader
                image: nginx
                ports:
                  - containerPort: 8080
                resources:
                  limits:
                    cpu: "0.1"
                  requests:
                    cpu: "0.1"
        workerReplicas: 1
        workerTemplate:
          metadata:
            labels:
              example.com/component: decode-worker
          spec:
            containers:
              - name: worker
                image: nginx
                ports:
                  - containerPort: 8080
                resources:
                  limits:
                    cpu: "0.1"
                  requests:
                    cpu: "0.1"
