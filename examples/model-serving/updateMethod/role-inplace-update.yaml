apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: sample-role-inplace
  namespace: default
spec:
  schedulerName: volcano
  replicas: 1  # inferGroup replicas
  recoveryPolicy: RoleRecreate
  rolloutStrategy:
    type: RoleRollingUpdate
    updateMethod: InPlace
    progressDeadlineSeconds: 1800
  template:
    restartGracePeriodSeconds: 60
    roles:
      - name: prefill
        replicas: 1
        maxUnavailable: 1
        entryTemplate:
          spec:
            containers:
              - name: leader
                image: nginx  # change only the image, for example to nginx:1.27, to trigger an in-place update
                ports:
                  - containerPort: 8080
        workerReplicas: 1
        workerTemplate:
          spec:
            containers:
              - name: worker
                image: nginx
                ports:
                  - containerPort: 8080
      - name: decode
        replicas: 1
        maxUnavailable: 1
        entryTemplate:
          spec:
            containers:
              - name: leader
                image: nginx
                ports:
                  - containerPort: 8080
        workerReplicas: 1
        workerTemplate:
          spec:
            containers:
              - name: worker
                image: nginx
                ports:
                  - containerPort: 8080
