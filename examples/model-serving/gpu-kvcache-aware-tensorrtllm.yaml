apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: trtllm-tinyllama-kv
  namespace: default
spec:
  schedulerName: volcano
  replicas: 1
  recoveryPolicy: ServingGroupRecreate
  template:
    restartGracePeriodSeconds: 60
    roles:
      - name: server
        replicas: 1
        entryTemplate:
          spec:
            initContainers:
              - name: downloader
                imagePullPolicy: IfNotPresent
                image: ghcr.io/volcano-sh/downloader:latest
                args:
                  - --source
                  - TinyLlama/TinyLlama-1.1B-Chat-v1.0
                  - --output-dir
                  - /models/TinyLlama-1.1B-Chat-v1.0/
                volumeMounts:
                  - name: models
                    mountPath: /models
            containers:
              - name: server
                # Official NGC TensorRT-LLM release image.
                image: nvcr.io/nvidia/tensorrt-llm/release:1.0.0
                command: ["sh", "-c"]
                args:
                  - |
                    # Buffered KV events (POST /kv_cache_events) for Kthena runtime.
                    # Requires enable_block_reuse + event_buffer_max_size > 0.
                    cat >/tmp/extra_llm_api_options.yaml <<'EOF'
                    enable_iter_perf_stats: true
                    kv_cache_config:
                      enable_block_reuse: true
                      event_buffer_max_size: 1024
                    EOF
                    trtllm-serve serve /models/TinyLlama-1.1B-Chat-v1.0 \
                      --host 0.0.0.0 \
                      --port 8000 \
                      --backend pytorch \
                      --extra_llm_api_options /tmp/extra_llm_api_options.yaml
                volumeMounts:
                  - name: models
                    mountPath: /models
                    readOnly: true
                  - name: shared-mem
                    mountPath: /dev/shm
                resources:
                  limits:
                    nvidia.com/gpu: 1
                readinessProbe:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
                  httpGet:
                    path: /health
                    port: 8000
                livenessProbe:
                  initialDelaySeconds: 900
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 10
                  httpGet:
                    path: /health
                    port: 8000
              - name: runtime
                image: ghcr.io/volcano-sh/runtime:latest
                imagePullPolicy: Always
                args:
                  - --port
                  - "8900"
                  - --engine
                  - tensorrtllm
                  - --engine-base-url
                  - http://localhost:8000
                  - --engine-metrics-path
                  - /metrics
                  - --pod
                  - $(POD_NAME).$(NAMESPACE)
                  - --model
                  - TinyLlama-1.1B-Chat-v1.0
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: REDIS_HOST
                    value: "redis-server.kthena-system.svc.cluster.local"
                  - name: REDIS_PORT
                    value: "6379"
                ports:
                  - containerPort: 8900
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8900
                  initialDelaySeconds: 5
                  periodSeconds: 10
            volumes:
              - name: models
                emptyDir: {}
              - name: shared-mem
                emptyDir:
                  medium: Memory
                  sizeLimit: 8Gi
        workerReplicas: 0
---
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: trtllm-tinyllama-kv
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      modelserving.volcano.sh/name: trtllm-tinyllama-kv
  workloadPort:
    port: 8000
  model: "TinyLlama-1.1B-Chat-v1.0"
  inferenceEngine: "TensorRTLLM"
  trafficPolicy:
    timeout: 120s
---
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelRoute
metadata:
  name: trtllm-tinyllama-kv
  namespace: default
spec:
  modelName: "TinyLlama-1.1B-Chat-v1.0"
  rules:
    - name: default
      targetModels:
        - modelServerName: trtllm-tinyllama-kv