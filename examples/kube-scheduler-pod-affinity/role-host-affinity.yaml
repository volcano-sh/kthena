# Role scoped co-location.
#
# Topology key: kubernetes.io/hostname
# Effect: pods in the same role instance and ServingGroup prefer the same node.
#
# ModelServing: role-affinity
# |
# +-- ServingGroup-0
# |   +-- prefill: [entry, worker] -> node-a
# |   +-- decode:  [entry, worker] -> node-b
# |
# +-- ServingGroup-1
#     +-- prefill: [entry, worker] -> node-c
#     +-- decode:  [entry, worker] -> node-d
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: role-affinity
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 2
  template:
    restartGracePeriodSeconds: 60
    roles:
      - name: prefill
        replicas: 1
        entryTemplate:
          spec:
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          modelserving.volcano.sh/name: role-affinity
                      matchLabelKeys:
                        - modelserving.volcano.sh/group-name
                        - modelserving.volcano.sh/role
                        - modelserving.volcano.sh/role-id
            containers:
              - name: leader
                image: ghcr.io/llm-d/llm-d-inference-sim:latest
                imagePullPolicy: IfNotPresent
                args:
                  - --model=kthena-pod-affinity-sim
                  - --served-model-name=kthena-pod-affinity-sim
                  - --port=8000
                  - --mode=echo
                  - --time-to-first-token=0
                  - --inter-token-latency=0
                ports:
                  - containerPort: 8000
        workerReplicas: 1
        workerTemplate:
          spec:
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          modelserving.volcano.sh/name: role-affinity
                      matchLabelKeys:
                        - modelserving.volcano.sh/group-name
                        - modelserving.volcano.sh/role
                        - modelserving.volcano.sh/role-id
            containers:
              - name: worker
                image: ghcr.io/llm-d/llm-d-inference-sim:latest
                imagePullPolicy: IfNotPresent
                args:
                  - --model=kthena-pod-affinity-sim
                  - --served-model-name=kthena-pod-affinity-sim
                  - --port=8000
                  - --mode=echo
                  - --time-to-first-token=0
                  - --inter-token-latency=0
                ports:
                  - containerPort: 8000
      - name: decode
        replicas: 1
        entryTemplate:
          spec:
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          modelserving.volcano.sh/name: role-affinity
                      matchLabelKeys:
                        - modelserving.volcano.sh/group-name
                        - modelserving.volcano.sh/role
                        - modelserving.volcano.sh/role-id
            containers:
              - name: leader
                image: ghcr.io/llm-d/llm-d-inference-sim:latest
                imagePullPolicy: IfNotPresent
                args:
                  - --model=kthena-pod-affinity-sim
                  - --served-model-name=kthena-pod-affinity-sim
                  - --port=8000
                  - --mode=echo
                  - --time-to-first-token=0
                  - --inter-token-latency=0
                ports:
                  - containerPort: 8000
        workerReplicas: 1
        workerTemplate:
          spec:
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          modelserving.volcano.sh/name: role-affinity
                      matchLabelKeys:
                        - modelserving.volcano.sh/group-name
                        - modelserving.volcano.sh/role
                        - modelserving.volcano.sh/role-id
            containers:
              - name: worker
                image: ghcr.io/llm-d/llm-d-inference-sim:latest
                imagePullPolicy: IfNotPresent
                args:
                  - --model=kthena-pod-affinity-sim
                  - --served-model-name=kthena-pod-affinity-sim
                  - --port=8000
                  - --mode=echo
                  - --time-to-first-token=0
                  - --inter-token-latency=0
                ports:
                  - containerPort: 8000
