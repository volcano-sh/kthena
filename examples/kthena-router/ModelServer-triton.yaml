apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: triton-tinyllama
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      modelserving.volcano.sh/name: triton-tinyllama
  workloadPort:
    port: 9000
  model: tinyllama
  inferenceEngine: Triton
  trafficPolicy:
    timeout: 120s
---
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelRoute
metadata:
  name: triton-tinyllama
  namespace: default
spec:
  modelName: tinyllama
  rules:
    - name: default
      targetModels:
        - modelServerName: triton-tinyllama
