apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: triton-pd-http
  namespace: default
spec:
  inferenceEngine: Triton
  model: tinyllama
  workloadPort:
    port: 9000
  workloadSelector:
    matchLabels:
      modelserving.volcano.sh/name: triton-pd
    pdGroup:
      groupKey: modelserving.volcano.sh/group-name
      prefillLabels:
        modelserving.volcano.sh/role: prefill
      decodeLabels:
        modelserving.volcano.sh/role: decode
  kvConnector:
    type: http
  trafficPolicy:
    timeout: 120s
---
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelRoute
metadata:
  name: triton-pd-http
  namespace: default
spec:
  modelName: tinyllama
  rules:
    - name: default
      targetModels:
        - modelServerName: triton-pd-http
