apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: triton-tinyllama-kv
  namespace: default
spec:
  inferenceEngine: Triton
  model: tinyllama
  workloadPort:
    port: 9000
  workloadSelector:
    matchLabels:
      modelserving.volcano.sh/name: triton-tinyllama-kv
  trafficPolicy:
    timeout: 120s
---
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelRoute
metadata:
  name: triton-tinyllama-kv
  namespace: default
spec:
  modelName: tinyllama
  rules:
    - name: default
      targetModels:
        - modelServerName: triton-tinyllama-kv
