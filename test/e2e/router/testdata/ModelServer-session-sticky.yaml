apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: deepseek-r1-1-5b-sticky
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: deepseek-r1-1-5b
  workloadPort:
    port: 8000
  model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  inferenceEngine: "vLLM"
  trafficPolicy:
    timeout: 10s
    sessionSticky:
      sessionAffinitySeconds: 300
      sources:
        - type: Header
          name: X-Sticky-Session
        - type: Query
          name: sticky_q
        - type: Cookie
          name: sticky_sid
