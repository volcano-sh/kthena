apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-plugin-kvcache-mock
spec:
  replicas: 3
  selector:
    matchLabels:
      app: router-plugin-kvcache-mock
  template:
    metadata:
      labels:
        app: router-plugin-kvcache-mock
    spec:
      containers:
        - name: llm-engine
          image: ghcr.io/llm-d/llm-d-inference-sim-dev:46db779
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - --model=kthena-plugin-mock
            - --served-model-name=router-plugin-model
            - --port=8000
            - --mode=echo
            - --enable-kvcache=true
            - --force-dummy-tokenizer=true
            - --kv-cache-size=8
            - --block-size=8
            - --event-batch-size=1
            - --max-num-seqs=2
            - --time-to-first-token=20ms
            - --inter-token-latency=5ms
            - --zmq-endpoint=tcp://*:5557
            - --zmq-topic=kv-events
            - --use-vllm-map-event-format=true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
        - name: kthena-runtime
          image: ghcr.io/volcano-sh/runtime:latest
          imagePullPolicy: Never
          args:
            - --engine=vllm
            - --engine-base-url=http://localhost:8000
            - --engine-metrics-path=/metrics
            - --pod=$(POD_NAME).$(POD_NAMESPACE)
            - --model=router-plugin-model
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_HOST
              value: redis-server
            - name: REDIS_PORT
              value: "6379"
            - name: VLLM_ZMQ_ENDPOINT
              value: tcp://localhost:5557
            - name: VLLM_ZMQ_TOPIC_FILTER
              value: kv-events
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 2
