---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: schedulerprofiles.networking.serving.volcano.sh
spec:
  group: networking.serving.volcano.sh
  names:
    kind: SchedulerProfile
    listKind: SchedulerProfileList
    plural: schedulerprofiles
    singular: schedulerprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SchedulerProfileSpec defines a complete scheduler plugin combination.
              The structure mirrors the router's global scheduler configuration
              (pluginConfig + plugins), but note the key casing differs: this API uses
              lowerCamelCase JSON names ("filter", "score"), the ConfigMap uses
              capitalized keys ("Filter", "Score").
            properties:
              pluginConfig:
                description: PluginConfig holds per-plugin arguments, keyed by plugin
                  name.
                items:
                  description: PluginConfig associates configuration arguments with
                    a named plugin.
                  properties:
                    args:
                      description: |-
                        Args is the plugin-specific configuration in YAML/JSON form. The
                        accepted shape depends on the plugin (see each plugin's docs).
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name is the plugin the arguments apply to, e.g.
                        "least-request".
                      type: string
                  required:
                  - name
                  type: object
                type: array
              plugins:
                description: |-
                  Plugins declares which filter and score plugins are enabled, with
                  their score weights. An empty section means no plugins of that kind
                  are enabled by this profile.
                properties:
                  filter:
                    description: Filter declares the filter plugins enabled by this
                      profile.
                    properties:
                      enabled:
                        description: Enabled filter plugin names, executed in list
                          order.
                        items:
                          type: string
                        type: array
                    type: object
                  score:
                    description: |-
                      Score declares the score plugins enabled by this profile, each with
                      its weight in the final score sum.
                    properties:
                      enabled:
                        description: Enabled score plugins with weights. Weight must
                          be greater than 0.
                        items:
                          description: PluginWithWeight pairs a score plugin name
                            with its weight.
                          properties:
                            name:
                              description: Name of the score plugin, e.g. "prefix-cache".
                              type: string
                            weight:
                              description: |-
                                Weight multiplies this plugin's score before it is summed with the
                                other plugins' weighted scores. Must be greater than 0.
                              format: int32
                              minimum: 1
                              type: integer
                          required:
                          - name
                          - weight
                          type: object
                        type: array
                    type: object
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
