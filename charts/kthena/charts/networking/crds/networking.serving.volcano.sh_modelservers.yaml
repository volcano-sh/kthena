---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: modelservers.networking.serving.volcano.sh
spec:
  group: networking.serving.volcano.sh
  names:
    kind: ModelServer
    listKind: ModelServerList
    plural: modelservers
    singular: modelserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Inference engine used to serve the model
      jsonPath: .spec.inferenceEngine
      name: Engine
      type: string
    - description: Model server port
      jsonPath: .spec.workloadPort.port
      name: Port
      type: integer
    - description: Model server protocol
      jsonPath: .spec.workloadPort.protocol
      name: Protocol
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelServer is the Schema for the modelservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelServerSpec defines the desired state of ModelServer.
            properties:
              apiKeySecretRef:
                description: |-
                  APIKeySecretRef references the API key the serving instances require, for
                  example a vLLM engine started with --api-key. The router sends it as a bearer
                  token when discovering the models a pod serves. The Secret must live in this
                  ModelServer's namespace and carry the
                  networking.serving.volcano.sh/external-model-provider-credential label.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: apiKeySecretRef.name is required
                  rule: has(self.name) && self.name != ''
                - message: apiKeySecretRef.optional must be false or unset
                  rule: '!has(self.optional) || !self.optional'
              endpoints:
                description: |-
                  Endpoints is a static list of model serving instances. It is intended for
                  deployments where the serving instances are not discoverable as pods of the
                  cluster the router runs in, for example when the router reads its
                  configuration from local files instead of the Kubernetes API server.
                  `endpoints` and `workloadSelector.matchLabels` are mutually exclusive;
                  exactly one of them must be specified.
                items:
                  description: Endpoint describes a single statically configured model
                    serving instance.
                  properties:
                    address:
                      description: Address is the IP address or DNS name of the model
                        serving instance.
                      maxLength: 253
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      description: |-
                        Labels are attached to the endpoint. They do not select serving instances;
                        they are only matched against `workloadSelector.pdGroup` to assign the
                        endpoint a prefill or decode role, `pdGroup` being the sole
                        `workloadSelector` field that may be combined with `endpoints`.
                      type: object
                    name:
                      description: |-
                        Name uniquely identifies the endpoint within the ModelServer. Together with
                        the ModelServer name it forms the instance identity in the router, for
                        example in metrics and debug output.
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    port:
                      description: |-
                        Port is the port the model serving instance listens on. It defaults to
                        `spec.workloadPort.port` when unset.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - address
                  - name
                  type: object
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              inferenceEngine:
                description: The inference engine used to serve the model.
                enum:
                - vLLM
                - SGLang
                type: string
              kvConnector:
                description: KVConnector specifies the KV connector configuration
                  for PD disaggregated routing
                properties:
                  type:
                    default: http
                    description: |-
                      Type specifies the connector type.
                      If you do not know which type to use, please use "http" as default.
                    enum:
                    - http
                    - lmcache
                    - nixl
                    - mooncake
                    type: string
                type: object
              model:
                description: |-
                  The real model that the modelServers are running.
                  If the `model` in LLM inference request is different from this field, it should be overwritten by this field.
                  Otherwise, the `model` in LLM inference request will not be mutated.
                maxLength: 256
                type: string
              trafficPolicy:
                description: Traffic Policy for accessing the model server instance.
                properties:
                  connectionPool:
                    description: |-
                      ConnectionPool configures the upstream HTTP connection pool used when
                      forwarding to this ModelServer's pods. When omitted, a shared default
                      pool is used. Each ModelServer that sets this gets its own isolated pool.
                    properties:
                      idleTimeout:
                        description: |-
                          IdleTimeout is how long an idle connection stays open before closing.
                          Defaults to 90s when omitted.
                        type: string
                      maxConnectionsPerHost:
                        description: |-
                          MaxConnectionsPerHost limits dialing, active and idle connections per host.
                          0 means unlimited. Defaults to 0 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                      maxIdleConnections:
                        description: |-
                          MaxIdleConnections is the total idle connections across all endpoints.
                          Defaults to 100 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                      maxIdleConnectionsPerHost:
                        description: |-
                          MaxIdleConnectionsPerHost is the idle connections per pod/endpoint.
                          Defaults to 64 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  retry:
                    description: The retry policy for the inference request.
                    properties:
                      attempts:
                        description: |-
                          The maximum number of times an individual inference request to a model server should be retried.
                          If the maximum number of retries has been done without a successgful response, the request will be considered failed.
                        format: int32
                        type: integer
                      retryInterval:
                        default: 100ms
                        description: RetryInterval is the interval between retries.
                        type: string
                    type: object
                  sessionSticky:
                    description: |-
                      SessionSticky pins requests with the same extracted session key to the same
                      backend Pod of this ModelServer for a TTL. Nil or omitted disables session
                      affinity for this ModelServer. It does not override ModelRoute weighted
                      selection among ModelServers.
                    properties:
                      sessionAffinitySeconds:
                        description: |-
                          SessionAffinitySeconds is binding TTL in seconds.
                          Once the session has been idle for more than the specified duration, the session becomes invalid.
                          When unset, the default is 300 (5 minutes).
                        format: int32
                        minimum: 1
                        type: integer
                      sources:
                        description: Sources are evaluated in order; the first non-empty
                          extracted value is the session key.
                        items:
                          description: SessionKeySource defines one session key extraction
                            rule.
                          properties:
                            name:
                              description: Name is the header name, query key, cookie
                                name, or JWT claim name.
                              minLength: 1
                              type: string
                            type:
                              description: SessionKeySourceType identifies how a session
                                key fragment is read.
                              enum:
                              - Header
                              - Query
                              - Cookie
                              - JWTClaim
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        maxItems: 16
                        type: array
                    type: object
                  timeout:
                    description: |-
                      Timeout bounds how long the router waits for the backend to start responding,
                      covering connection setup, sending the request and waiting for the response
                      headers. It does not bound inference response bodies, so a streamed response
                      may run longer. Connector setup exchanges may use the timeout for their
                      complete response. By default, there is no timeout.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: sessionSticky.sources must be non-empty when sessionSticky
                    is set
                  rule: '!has(self.sessionSticky) || self.sessionSticky == null ||
                    size(self.sessionSticky.sources) > 0'
              workloadPort:
                description: |-
                  WorkloadPort defines the port and protocol configuration for the model server.
                  It may be omitted only when every entry in `endpoints` declares its own
                  `port`; endpoints without an explicit `port` fall back to `workloadPort.port`.
                properties:
                  port:
                    description: The port of the model server. The number must be
                      between 1 and 65535.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    default: http
                    description: The protocol of the model server. Supported values
                      are "http" and "https".
                    enum:
                    - http
                    - https
                    type: string
                required:
                - port
                type: object
              workloadSelector:
                description: |-
                  WorkloadSelector is used to match the model serving instances.
                  Currently, they must be pods within the same namespace as modelServer object.
                  `workloadSelector.matchLabels` and `endpoints` are mutually exclusive ways of
                  declaring the serving instances, so exactly one of them must be used.
                  `workloadSelector.pdGroup` does not select instances; it only assigns them
                  prefill and decode roles, and therefore is the sole `workloadSelector` field
                  that may also be combined with `endpoints`.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      The base labels to match the model serving instances.
                      All serving instances must match these labels.
                    type: object
                  pdGroup:
                    description: |-
                      PDGroup is used to further match different roles of the model serving instances,
                      mainly used in case like PD disaggregation.
                    properties:
                      decodeLabels:
                        additionalProperties:
                          type: string
                        description: The labels to match the model serving instances
                          for decode.
                        type: object
                      groupKey:
                        description: |-
                          GroupKey is the key to distinguish different PD groups.
                          Only PD instances with the same group key and value could be paired.
                        type: string
                      prefillLabels:
                        additionalProperties:
                          type: string
                        description: The labels to match the model serving instances
                          for prefill.
                        type: object
                    required:
                    - decodeLabels
                    - groupKey
                    - prefillLabels
                    type: object
                type: object
            required:
            - inferenceEngine
            type: object
          status:
            description: ModelServerStatus defines the observed state of ModelServer.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
