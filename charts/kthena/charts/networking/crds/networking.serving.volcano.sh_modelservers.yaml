---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: modelservers.networking.serving.volcano.sh
spec:
  group: networking.serving.volcano.sh
  names:
    kind: ModelServer
    listKind: ModelServerList
    plural: modelservers
    singular: modelserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Inference engine used to serve the model
      jsonPath: .spec.inferenceEngine
      name: Engine
      type: string
    - description: Model server port
      jsonPath: .spec.workloadPort.port
      name: Port
      type: integer
    - description: Model server protocol
      jsonPath: .spec.workloadPort.protocol
      name: Protocol
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelServer is the Schema for the modelservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelServerSpec defines the desired state of ModelServer.
            properties:
              inferenceEngine:
                description: The inference engine used to serve the model.
                enum:
                - vLLM
                - SGLang
                type: string
              kvConnector:
                description: KVConnector specifies the KV connector configuration
                  for PD disaggregated routing
                properties:
                  type:
                    default: http
                    description: |-
                      Type specifies the connector type.
                      If you do not know which type to use, please use "http" as default.
                    enum:
                    - http
                    - lmcache
                    - nixl
                    - mooncake
                    type: string
                type: object
              model:
                description: |-
                  The real model that the modelServers are running.
                  If the `model` in LLM inference request is different from this field, it should be overwritten by this field.
                  Otherwise, the `model` in LLM inference request will not be mutated.
                maxLength: 256
                type: string
              trafficPolicy:
                description: Traffic Policy for accessing the model server instance.
                properties:
                  connectionPool:
                    description: |-
                      ConnectionPool configures the upstream HTTP connection pool used when
                      forwarding to this ModelServer's pods. When omitted, a shared default
                      pool is used. Each ModelServer that sets this gets its own isolated pool.
                    properties:
                      idleTimeout:
                        description: |-
                          IdleTimeout is how long an idle connection stays open before closing.
                          Defaults to 90s when omitted.
                        type: string
                      maxConnectionsPerHost:
                        description: |-
                          MaxConnectionsPerHost limits dialing, active and idle connections per host.
                          0 means unlimited. Defaults to 0 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                      maxIdleConnections:
                        description: |-
                          MaxIdleConnections is the total idle connections across all endpoints.
                          Defaults to 100 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                      maxIdleConnectionsPerHost:
                        description: |-
                          MaxIdleConnectionsPerHost is the idle connections per pod/endpoint.
                          Defaults to 64 when omitted.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  retry:
                    description: The retry policy for the inference request.
                    properties:
                      attempts:
                        description: |-
                          The maximum number of times an individual inference request to a model server should be retried.
                          If the maximum number of retries has been done without a successgful response, the request will be considered failed.
                        format: int32
                        type: integer
                      retryInterval:
                        default: 100ms
                        description: RetryInterval is the interval between retries.
                        type: string
                    type: object
                  sessionSticky:
                    description: |-
                      SessionSticky pins requests with the same extracted session key to the same
                      backend Pod of this ModelServer for a TTL. Nil or omitted disables session
                      affinity for this ModelServer. It does not override ModelRoute weighted
                      selection among ModelServers.
                    properties:
                      sessionAffinitySeconds:
                        description: |-
                          SessionAffinitySeconds is binding TTL in seconds.
                          Once the session has been idle for more than the specified duration, the session becomes invalid.
                          When unset, the default is 300 (5 minutes).
                        format: int32
                        minimum: 1
                        type: integer
                      sources:
                        description: Sources are evaluated in order; the first non-empty
                          extracted value is the session key.
                        items:
                          description: SessionKeySource defines one session key extraction
                            rule.
                          properties:
                            name:
                              description: Name is the header name, query key, cookie
                                name, or JWT claim name.
                              minLength: 1
                              type: string
                            type:
                              description: SessionKeySourceType identifies how a session
                                key fragment is read.
                              enum:
                              - Header
                              - Query
                              - Cookie
                              - JWTClaim
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        maxItems: 16
                        type: array
                    type: object
                  timeout:
                    description: |-
                      Timeout bounds how long the router waits for the backend to start responding,
                      covering connection setup, sending the request and waiting for the response
                      headers. It does not bound inference response bodies, so a streamed response
                      may run longer. Connector setup exchanges may use the timeout for their
                      complete response. By default, there is no timeout.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: sessionSticky.sources must be non-empty when sessionSticky
                    is set
                  rule: '!has(self.sessionSticky) || self.sessionSticky == null ||
                    size(self.sessionSticky.sources) > 0'
              workloadPort:
                description: WorkloadPort defines the port and protocol configuration
                  for the model server.
                properties:
                  port:
                    description: The port of the model server. The number must be
                      between 1 and 65535.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    default: http
                    description: The protocol of the model server. Supported values
                      are "http" and "https".
                    enum:
                    - http
                    - https
                    type: string
                required:
                - port
                type: object
              workloadSelector:
                description: |-
                  WorkloadSelector is used to match the model serving instances.
                  Currently, they must be pods within the same namespace as modelServer object.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      The base labels to match the model serving instances.
                      All serving instances must match these labels.
                    type: object
                  pdGroup:
                    description: |-
                      PDGroup is used to further match different roles of the model serving instances,
                      mainly used in case like PD disaggregation.
                    properties:
                      decodeLabels:
                        additionalProperties:
                          type: string
                        description: The labels to match the model serving instances
                          for decode.
                        type: object
                      groupKey:
                        description: |-
                          GroupKey is the key to distinguish different PD groups.
                          Only PD instances with the same group key and value could be paired.
                        type: string
                      prefillLabels:
                        additionalProperties:
                          type: string
                        description: The labels to match the model serving instances
                          for prefill.
                        type: object
                    required:
                    - decodeLabels
                    - groupKey
                    - prefillLabels
                    type: object
                type: object
            required:
            - inferenceEngine
            - workloadPort
            - workloadSelector
            type: object
          status:
            description: ModelServerStatus defines the observed state of ModelServer.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
