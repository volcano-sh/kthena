apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kthena-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: kthena-router
    {{- include "kthena.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.kthenaRouter.webhook.tls.secretName }}
    verbs:
      - get
