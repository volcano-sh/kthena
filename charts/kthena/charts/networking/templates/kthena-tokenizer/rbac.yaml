{{- with .Values.kthenaRouter.tokenizerService }}
{{- if and .enabled (eq .mode "standalone") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kthena-tokenizer
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: kthena-tokenizer
    {{- include "kthena.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthena-tokenizer
  labels:
    app.kubernetes.io/component: kthena-tokenizer
    {{- include "kthena.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - networking.serving.volcano.sh
    resources:
      - modelservers
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kthena-tokenizer
  labels:
    app.kubernetes.io/component: kthena-tokenizer
    {{- include "kthena.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kthena-tokenizer
subjects:
  - kind: ServiceAccount
    name: kthena-tokenizer
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
