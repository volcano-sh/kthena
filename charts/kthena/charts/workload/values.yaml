controllerManager:
  webhook:
    enabled: true
    tls:
      # certSecretName is the name of the secret to store auto-generated certificates
      certSecretName: kthena-controller-manager-webhook-certs
      # serviceName is the service name used for certificate DNS names
      serviceName: kthena-controller-manager-webhook
  evictionWebhook:
    # enabled controls the pods/eviction protection webhook. It is disabled by default
    # because it adds admission latency to node drain workflows.
    enabled: false
    failurePolicy: Fail
    timeoutSeconds: 5
    trackerTTLSeconds: 60
  # replicas is the number of instances to run.
  replicas: 1
  image:
    repository: ghcr.io/volcano-sh/kthena-controller-manager
    # node: edit by CI. No need to modify manually
    tag: latest
    pullPolicy: IfNotPresent
    # to turn the webhook off, set controllerManager.webhook.enabled to false
    args: [ "--v=2" ]
  resource:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # controllers specifies which controllers to enable
  # Available options: modelserving, modelbooster, autoscaler
  # If empty or not specified, all controllers are enabled
  controllers: ""
  # kubeAPIQPS is the QPS (queries per second) to use while talking with kubernetes apiserver
  # If 0 or not specified, uses default value (5)
  kubeAPIQPS: 0
  # kubeAPIBurst is the burst to use while talking with kubernetes apiserver
  # If 0 or not specified, uses default value (10)
  kubeAPIBurst: 0
  # debugPort is the debug HTTP server port.
  # If 0 or not specified, debug server is disabled.
  debugPort: 0
  # autoscalingSyncPeriodSeconds is the reconcile interval in seconds for the autoscaler.
  # Smaller values react faster to traffic spikes but increase API server load.
  # If 0 or not specified, uses the binary default (15).
  autoscalingSyncPeriodSeconds: 0
  # drainTimeout is the max wait for in-flight requests to drain before deleting
  # a pod during lossless upgrade. "0"/"0s"/0 disables draining; empty uses 0
  # (disabled). Set >0 to enable lossless drain during maxSurge rollouts.
  drainTimeout: ""
  # downloaderImage is the container image used for downloading models.
  downloaderImage:
    repository: ghcr.io/volcano-sh/downloader
    # node: edit by CI. No need to modify manually
    tag: latest
  # runtimeImage is the container image used for running models.
  runtimeImage:
    repository: ghcr.io/volcano-sh/runtime
    # node: edit by CI. No need to modify manually
    tag: latest
  downloader:
    # accessKey is the access key for the downloader.
    accessKey: ""
    # secretKey is the secret key for the downloader.
    secretKey: ""
  ## Tolerations for Controller Manager pods.
  tolerations: []
